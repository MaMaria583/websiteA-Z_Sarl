# Publication Hostinger : à chaque mise à jour de `main`, génère le site pour www.azsarl.com
# et place le résultat (contenu de dist/) dans la branche `hostinger`.
# Dans hPanel → Git : dépôt de ce projet, branche `hostinger`, dossier vide (public_html),
# avec l'auto-déploiement (webhook) activé.
name: Publication Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOSTING: hostinger
      SITE_URL: https://www.azsarl.com
      # Mise en ligne définitive (indexation Google, sitemap) : remplacer 'true' par 'false'
      SITE_TEST_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer le site
        run: node build.mjs
      - name: Publier dans la branche hostinger
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site généré depuis ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger
